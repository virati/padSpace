# padSpace command bindings
#
# Format:   <button> [@color] = <shell command>
#   <button>  pad note number (grid: note = 10*row + col, row 1 = bottom),
#             or ccN for a round button (top row cc91-98, right column cc19-89)
#   @color    optional LED palette index (default 45 blue); common values:
#             1 dim white, 3 white, 5 red, 13 yellow, 21 green, 37 cyan,
#             45 blue, 53 purple
#
# Rows 81-88 and 71-78 are reserved for workspace switching and can't be bound.
# Commands run detached via systemd-run --user. Edits here apply within ~3 s —
# no restart needed. Press any unbound button and check
# `journalctl --user -u launchpad-workspaces -f` to learn its ID.
#
# Examples (uncomment to use):
#11 = konsole
#12 @13 = playerctl play-pause
#18 @5 = loginctl lock-session
#cc98 @53 = spectacle --region

# soundboard
18 @53 = paplay $HOME/.local/share/padspace/science-bitch.wav
